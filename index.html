<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Collection</title>
    <style>
        body {
            font-family: Arial Narrow, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 30px;
        }
        h1 {
            color: Yellow;
        }
        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            background-color: Grey;
            color: white;
            border: none;
        }
        .book {
            background: Blue;
            margin: 15px auto;
            padding: 15px;
            max-width: 400px;
            border-radius: 8px;
        }
        .delete {
            background-color: crimson;
        }
    </style>
</head>
<body>
    <h1>Book Collection</h1>
    <p>Manage your books using this simple website.</p>
    <h3>Add a New Book</h3>
    <input type="text" id="title" placeholder="Book Title">
    <input type="text" id="author" placeholder="Author Name">
    <button onclick="addBook()">Add Book</button>
    <h2>Available Books</h2>
    <div id="bookList"></div>
    <script>
        const API = '/books';
        async function loadBooks() {
            try {
                const response = await fetch(API);
                const books = await response.json();
                const list = document.getElementById('bookList');
                list.innerHTML = '';
                books.forEach(book => {
                    const div = document.createElement('div');
                    div.className = 'book';
                    const title = document.createElement('h3');
                    title.textContent = book.title;
                    const author = document.createElement('p');
                    author.textContent = 'Author: ' + book.author;
                    const edit = document.createElement('button');
                    edit.textContent = 'Edit';
                    edit.onclick = () => editBook(book);
                    const remove = document.createElement('button');
                    remove.textContent = 'Delete';
                    remove.className = 'delete';
                    remove.onclick = () => deleteBook(book.id);
                    div.append(title, author, edit, remove);
                    list.appendChild(div);
                });
            } catch (error) {
                document.getElementById('bookList').textContent =
                    'Unable to load books. Please start the server.';
            }
        }
        async function addBook() {
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            if (!title || !author) {
                alert('Please enter both the book title and author.');
                return;
            }
            const response = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, author })
            });
            if (response.ok) {
                document.getElementById('title').value = '';
                document.getElementById('author').value = '';
                loadBooks();
            } else {
                alert('Unable to add the book.');
            }
        }
        async function editBook(book) {
            const title = prompt('Enter the new title:', book.title);
            if (title === null) return;
            const author = prompt('Enter the new author:', book.author);
            if (author === null) return;
            if (!title.trim() || !author.trim()) {
                alert('Title and author cannot be empty.');
                return;
            }
            const response = await fetch(API + '/' + book.id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: title.trim(),
                    author: author.trim()
                })
            });
            if (response.ok) loadBooks();
            else alert('Unable to update the book.');
        }
        async function deleteBook(id) {
            if (!confirm('Are you sure you want to delete this book?')) return;
            const response = await fetch(API + '/' + id, {
                method: 'DELETE'
            });
            if (response.ok) loadBooks();
            else alert('Unable to delete the book.');
        }
        loadBooks();
    </script>
</body>
</html>
